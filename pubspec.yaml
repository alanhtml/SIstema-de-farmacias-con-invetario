name: farmacia_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  
  # Autenticación y Base de Datos
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.1.2
  firebase_app_check: ^0.3.1
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.2

  # Comunicación HTTP con Node.js
  http: ^1.6.0

  # Escáner y Permisos de Cámara
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.1

  # Mapas y Geolocalización (Ubicación de reportes)
  google_maps_flutter: ^2.17.0
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2

  # Diseño e Iconos
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  font_awesome_flutter: ^10.7.0
  image_picker: ^1.2.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/